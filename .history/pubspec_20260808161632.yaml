name: mafia_help
description: "A new Flutter project."
publish_to: 'none'

version: 1.8.5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Хранение данных (Hive CE)
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.3.0
  path_provider: ^2.1.5
  open_file: ^3.3.2


  # Навигация
  go_router: ^14.8.1

  # Управление состоянием
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1

  pie_menu: ^3.6.0

  logger: ^2.0.2
  window_manager: ^0.5.1
  http: ^1.2.0
  shared_preferences: ^2.2.3

  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  image_picker: ^1.2.3
  http_parser: ^4.1.2
  mdi_plus: ^7.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # Генерация кода для Hive
  hive_ce_generator: ^1.8.2
  build_runner: ^2.4.14

  flutter_launcher_icons: ^0.13.0

flutter_launcher_icons:
  android: true
  image_path: "assets/mafia_logo.png"
  adaptive_icon_background: "#1a1a1a"
  adaptive_icon_foreground: "assets/mafia_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/citizen.png
    - assets/sheriff.png
    - assets/mafia.png
    - assets/don.png
    - assets/mafia_logo.png
    - assets/background.jpeg
    - assets/fsm.png
    - assets/logo_new.png
    - assets/fsmtext.png
    - assets/fsmtext.jpeg
    - assets/donborder.png
    - assets/presidentborder1.png
    - assets/presidentborder2.png
    - assets/presidentborder3.png
    - assets/residentborder1.png
    - assets/residentborder2.png
    - assets/sheriffborder.png
    - assets/mafiaborder.png
    - assets/citizenborder.png
    - assets/clubb.png
    - assets/don.png
